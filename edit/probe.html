<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QuietPad Drive probe</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    button { font: inherit; padding: .5rem 1rem; }
    pre { background: #f3f3f3; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>QuietPad Drive probe</h1>
  <p>Temporary diagnostic: with only the <code>drive.file</code> permission, which files
  in your QuietPad Drive folder can this site see? Nothing is changed or uploaded.</p>
  <button id="go">Sign in with Google and run</button>
  <pre id="out">Not run yet.</pre>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
  <script>
    const out = document.getElementById("out");
    const log = (s) => { out.textContent += s + "\n"; };

    async function drive(path) {
      const r = await fetch("https://www.googleapis.com/drive/v3" + path, {
        headers: { Authorization: "Bearer " + token }
      });
      if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 200));
      return r.json();
    }

    // ?client=<oauth client id> tests a different Google Cloud project without redeploying.
    const CLIENT_ID = new URLSearchParams(location.search).get("client") || QUIETPAD_CONFIG.CLIENT_ID;
    log("Client ID: " + CLIENT_ID);

    let token = null;
    async function run() {
      log("");
      try {
        const folders = await drive("/files?q=" + encodeURIComponent(
          "name = 'QuietPad' and mimeType = 'application/vnd.google-apps.folder' and trashed = false") +
          "&fields=files(id,name,createdTime)&pageSize=20");
        log("1) Folders named 'QuietPad' visible to this site: " + folders.files.length);
        for (const f of folders.files) {
          const kids = await drive("/files?q=" + encodeURIComponent("'" + f.id + "' in parents and trashed = false") +
            "&fields=files(id,name,mimeType)&pageSize=100");
          log("   Folder " + f.id + " (created " + f.createdTime + "): " + kids.files.length + " visible files");
          kids.files.slice(0, 15).forEach((k) => log("     - " + k.name + "  [" + k.mimeType + "]"));
        }
        const all = await drive("/files?fields=files(id,name,mimeType)&pageSize=100&q=" +
          encodeURIComponent("trashed = false"));
        log("2) All files visible to this site (any location, first 100): " + all.files.length);
        all.files.slice(0, 15).forEach((k) => log("   - " + k.name + "  [" + k.mimeType + "]"));
        log("\nDone.");
      } catch (e) {
        log("Error: " + e.message);
      }
    }

    document.getElementById("go").addEventListener("click", () => {
      out.textContent = "Signing in…\n";
      google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        hint: new URLSearchParams(location.search).get("hint") || undefined,
        scope: QUIETPAD_CONFIG.SCOPE,
        callback: (resp) => {
          if (resp.error) { log("Sign-in failed: " + resp.error + " " + (resp.error_description || "")); return; }
          token = resp.access_token;
          run();
        },
        error_callback: (e) => log("Sign-in popup problem: " + (e && e.type ? e.type : JSON.stringify(e)))
      }).requestAccessToken({ prompt: "select_account consent" });
    });
  </script>
</body>
</html>
