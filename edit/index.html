<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuietPad Editor</title>
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="editor.css?v=3">
</head>
<body>
  <!--
    Three screens, exactly one visible at a time (toggled via [hidden] in
    editor.js — never inline style.display, see that file's own notes):
      #signin-screen  — not yet authorized
      #picker-screen  — authorized, but no file loaded yet (a plain visit,
                         no Drive handoff) — this is the Notepad-style
                         "File > Open / File > New" screen
      #editor-screen  — a file is loaded and editable
      #error-screen   — loaded, but this file can't be edited here
  -->

  <div id="signin-screen" class="screen">
    <div class="centered">
      <span class="brand-mark" aria-hidden="true">&#128221;</span>
      <h1>QuietPad</h1>
      <p class="muted">Sign in with Google to open a file from your Drive.</p>
      <button id="signin-button" class="button button-primary button-large">Sign in with Google</button>
    </div>
  </div>

  <div id="picker-screen" class="screen" hidden>
    <div class="centered">
      <span class="brand-mark" aria-hidden="true">&#128221;</span>
      <h1>QuietPad</h1>
      <p class="muted">Open an existing file, or start a new one.</p>
      <div class="button-row">
        <button id="open-button" class="button button-primary">Open a file&hellip;</button>
        <button id="new-button" class="button">New file</button>
      </div>
    </div>
  </div>

  <div id="editor-screen" class="screen" hidden>
    <div class="editor-topbar">
      <a href="../" class="icon-button" title="Home" aria-label="Home">&#8592;</a>
      <input id="filename-input" type="text" class="filename-input" spellcheck="false">
      <span id="save-status" class="save-status">Saved</span>
    </div>
    <textarea id="content-area" class="content-area" spellcheck="false" placeholder="Start typing&hellip;"></textarea>
  </div>

  <div id="error-screen" class="screen" hidden>
    <div class="centered">
      <span class="brand-mark" aria-hidden="true">&#9888;&#65039;</span>
      <h1>Can&rsquo;t open this file</h1>
      <p id="error-message" class="muted"></p>
      <a href="../" class="button">Back to QuietPad</a>
    </div>
  </div>

  <!-- TEMPORARY: a live event log, deliberately OUTSIDE the .screen divs above
       (fixed position, always in the DOM) so it stays visible no matter which
       screen is actually showing -- unlike the previous debug line, which
       lived inside #editor-screen and so was invisible for exactly the cases
       that most needed explaining (never actually reaching that screen).
       Remove once the "There was an error!" report is understood. -->
  <div id="debug-log" style="position:fixed;left:0;right:0;bottom:0;max-height:35vh;overflow-y:auto;background:#000;color:#0f0;font:10px monospace;padding:6px;z-index:9999;white-space:pre-wrap;word-break:break-all;"></div>

  <!-- Google Identity Services (sign-in) and the API client loader (Picker) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="config.js?v=5"></script>
  <script src="editor.js?v=6"></script>
</body>
</html>
